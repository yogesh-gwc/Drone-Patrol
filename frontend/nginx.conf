# Static host for the Zero Accident Prevention operator UI.
#
# The app is a single-page bundle that talks to the backend directly from the
# browser, so nginx serves files and nothing else - there is no API proxy here.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints every asset filename, so they can be cached hard. The
    # entry HTML must not be, or a deploy leaves browsers on the old bundle
    # pointing at asset names that no longer exist.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The camera clips are large. Range requests let the browser seek and
    # start playback without pulling the whole file first.
    location ~* \.(mp4|webm)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header Accept-Ranges bytes;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The bundle is ~1.9 MB before compression, mostly MapLibre and Three.js.
    client_max_body_size 2m;
}
